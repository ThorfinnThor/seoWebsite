name: Sync affiliate product feeds
on:
  schedule:
    - cron: "17 4 * * *"
      timezone: "Europe/Berlin"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: product-feed-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      AWIN_FEED_URLS_JSON: ${{ secrets.AWIN_FEED_URLS_JSON }}
      FEED_SYNC_SCHEDULED: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
      AWIN_FEED_SCHEDULE_ENABLED: ${{ vars.AWIN_FEED_SCHEDULE_ENABLED }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check feed configuration
        id: feed
        shell: bash
        run: |
          if [ -z "$AWIN_FEED_URLS_JSON" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Affiliate feed secret is not configured; skipping sync."
            echo "### Affiliate-Feed-Sync deaktiviert" >> "$GITHUB_STEP_SUMMARY"
            echo "Das Secret AWIN_FEED_URLS_JSON fehlt. Es wurden keine Produktdaten geladen oder geändert." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$FEED_SYNC_SCHEDULED" = "true" ] && [ "$AWIN_FEED_SCHEDULE_ENABLED" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Scheduled affiliate feed sync is not enabled; skipping sync."
            echo "### Automatischer Affiliate-Feed-Sync pausiert" >> "$GITHUB_STEP_SUMMARY"
            echo "Setze die Repository-Variable AWIN_FEED_SCHEDULE_ENABLED erst nach einem erfolgreichen manuellen Test auf true." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v6
        if: steps.feed.outputs.enabled == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.feed.outputs.enabled == 'true'
      - run: npm run sync:products
        if: steps.feed.outputs.enabled == 'true'
      - name: Verify catalogs and production export
        run: npm run verify
        if: steps.feed.outputs.enabled == 'true'
      - name: Commit catalog changes
        if: steps.feed.outputs.enabled == 'true'
        shell: bash
        run: |
          if git diff --quiet -- public/data data/review; then
            echo "No catalog changes."
            exit 0
          fi
          git config user.name "passendplanen-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data data/review
          git commit -m "chore(data): refresh affiliate catalogs"
          git push
