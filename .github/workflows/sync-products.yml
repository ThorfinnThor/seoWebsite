name: Sync affiliate product feeds
on:
  schedule:
    - cron: "17 4 * * *"
      timezone: "Europe/Berlin"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: product-feed-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWIN_FEED_URLS_JSON: ${{ secrets.AWIN_FEED_URLS_JSON }}
      FEED_SYNC_SCHEDULED: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
      AWIN_FEED_SCHEDULE_ENABLED: ${{ vars.AWIN_FEED_SCHEDULE_ENABLED }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check feed configuration
        shell: bash
        run: |
          if [ -z "$AWIN_FEED_URLS_JSON" ]; then
            echo "::error::Das Secret AWIN_FEED_URLS_JSON fehlt."
            exit 1
          fi
          if [ "$FEED_SYNC_SCHEDULED" = "true" ] && [ "$AWIN_FEED_SCHEDULE_ENABLED" != "true" ]; then
            echo "::error::Der Zeitplan ist nicht freigegeben. Setze AWIN_FEED_SCHEDULE_ENABLED auf true."
            exit 1
          fi
          node -e 'const value=JSON.parse(process.env.AWIN_FEED_URLS_JSON); if (!value || typeof value !== "object") throw new Error("AWIN_FEED_URLS_JSON muss eine JSON-Liste oder ein JSON-Objekt enthalten.")'
          echo "### Affiliate-Feed-Konfiguration geprüft" >> "$GITHUB_STEP_SUMMARY"
          echo "Secret vorhanden, JSON lesbar und Zeitplan freigegeben." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run sync:products
      - name: Verify merchant and affiliate targets
        run: npm run verify:merchant-links -- --write
      - name: Verify catalogs and production export
        run: npm run verify
      - name: Record successful feed health check
        shell: bash
        run: |
          echo "### Affiliate-Feed-Sync vollständig ausgeführt" >> "$GITHUB_STEP_SUMMARY"
          echo "Produktimport, Linkprüfung und vollständiger Produktions-Build waren erfolgreich." >> "$GITHUB_STEP_SUMMARY"
      - name: Commit catalog changes
        shell: bash
        run: |
          if git diff --quiet -- public/data data/review; then
            echo "No catalog changes."
            exit 0
          fi
          git config user.name "passendplanen-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data data/review
          git commit -m "chore(data): refresh affiliate catalogs"
          git push
